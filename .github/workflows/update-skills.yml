name: Update Skills

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update skills
        run: npx -y skills@latest update -p
        continue-on-error: true

      - name: Detect skills-lock.json changes
        id: lock
        run: |
          if git diff --quiet -- skills-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "skills-lock.json unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "skills-lock.json changed"
          fi

      - name: Bump versions
        if: steps.lock.outputs.changed == 'true'
        run: node .github/scripts/bump-version.mjs

      - name: Commit and push
        if: steps.lock.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update skills"
          git push
